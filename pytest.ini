[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --browser=chromium
    --base-url=https://the-internet.herokuapp.com
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=results/evidence
    --html=results/report.html
    --self-contained-html
    --junitxml=results/junit.xml
